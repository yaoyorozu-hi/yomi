[package]
name = "yhi-yomi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Claude Code session-data plane: archive, wipe, and search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yaoyorozu-hi/yomi"
readme = "README.md"

[[bin]]
name = "yomi"
path = "src/main.rs"

[lib]
name = "yomi"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", features = ["general-category"] }
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
filetime = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# This binary computes byte offsets and lengths that decide which spans get
# redacted. A wrapped arithmetic op there silently produces the wrong span and
# leaks the secret it was supposed to remove; a panic does not. Release keeps
# the same arithmetic semantics as debug so that gap cannot exist.
overflow-checks = true
# Deliberately left at the default (false): the rescan fault seam in
# `src/rescan/mod.rs` is gated on `debug_assertions` precisely so a release
# binary cannot be made to skip the stored rename via the environment.
debug-assertions = false
