name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly canary: catches stable-toolchain drift and newly published advisories
    # between commits, not just at PR time.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.rust }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 1.89 is the declared MSRV (Cargo.toml rust-version). stable guards
        # against breakage introduced by newer toolchains.
        rust: ['1.89', 'stable']
        # release is a genuinely different build: `debug_assertions` is off, so
        # the rescan fault seam disappears, and `overflow-checks` is set
        # explicitly in Cargo.toml rather than inherited. Shipping is done from
        # release, so release is gated.
        profile: [debug, release]
        include:
          - profile: debug
            flags: ''
          - profile: release
            flags: '--release'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build
        run: cargo build --locked ${{ matrix.flags }}

      - name: cargo test
        run: cargo test --locked --no-fail-fast ${{ matrix.flags }}

  lint:
    # Pinned to the MSRV so the gate is deterministic: a new clippy release can
    # never turn main red on its own.
    name: fmt + clippy (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.89'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # `cfg(debug_assertions)` code is invisible to the debug pass above: a
      # release-only dead helper or lint would otherwise reach main unseen.
      - name: cargo clippy (release)
        run: cargo clippy --locked --all-targets --release -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny yanked
